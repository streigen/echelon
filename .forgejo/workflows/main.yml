name: 'build-test'

on:
 - pull_request
 - push

jobs:
  build-windows:
    runs-on: hetz
    container:
      image: git.flaxeneel2.net/streigen/build-environments/build-environment-windows:latest
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_CONFIG }}" > ~/.ssh/config
          chmod 400 ~/.ssh/config
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: "${{ secrets.SSH_KNOWN_HOSTS }}"
      - name: Build Windows
        run: cargo xwin build --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: "-C link-arg=/FORCE:MULTIPLE -C link-arg=/ignore:4006 -C link-arg=/NODEFAULTLIB:libucrt.lib -C link-arg=/NODEFAULTLIB:libvcruntime.lib -C link-arg=/NODEFAULTLIB:libcmt.lib -C link-arg=ucrt.lib -C link-arg=vcruntime.lib"
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-x86_64
          retention-days: 7
          path: target/x86_64-pc-windows-msvc/debug/echelon.exe
  build-linux:
    runs-on: hetz
    container:
      image: git.flaxeneel2.net/streigen/build-environments/build-environment-linux:latest
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_CONFIG }}" > ~/.ssh/config
          chmod 400 ~/.ssh/config
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: "${{ secrets.SSH_KNOWN_HOSTS }}"
      - name: Build Linux
        run: cargo build
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-x86_64
          retention-days: 7
          path: target/debug/echelon

  build-android:
    runs-on: hetz
    container:
      image: git.flaxeneel2.net/streigen/build-environments/build-environment-android:latest
    steps:
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_CONFIG }}" > ~/.ssh/config
          chmod 400 ~/.ssh/config
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: "${{ secrets.SSH_KNOWN_HOSTS }}"
      - name: Write android debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          chmod 400 ~/.android/debug.keystore
      - name: Build Android
        run: bash scripts/android-build.sh
        env:
          CARGO_PROFILE_DEV_DEBUG: 1
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-arm64-x86_64
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            android/app/build/outputs/apk/debug/app-x86_64-debug.apk

